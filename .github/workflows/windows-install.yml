name: Windows installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-start:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install without development dependencies or models
        shell: powershell
        run: ./scripts/install-local-transcriber.ps1 -PythonExecutable (Get-Command python).Source
      - name: Verify installed package, web interface and fresh database
        shell: powershell
        run: ./.venv/Scripts/python.exe -B ./scripts/smoke-installed.py --runtime-root output/install-smoke
      - name: Build self-contained Windows installer
        shell: powershell
        run: ./scripts/build-windows-installer.ps1
      - name: Verify embedded Python with fresh offline runtime
        shell: powershell
        run: |
          $payload = Get-ChildItem build/windows-*/payload/python/python.exe | Select-Object -Last 1
          & $payload.FullName -B ./scripts/smoke-installed.py --runtime-root output/embedded-smoke --desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Setup maintenance without touching an existing installation
        shell: powershell
        run: |
          $setup = Get-ChildItem dist/LocalTranscriber-Setup-*-windows-x64.exe | Select-Object -First 1
          ./scripts/verify-windows-maintenance.ps1 -Installer $setup.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: LocalTranscriber-windows-x64
          path: dist/*
