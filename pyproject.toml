[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-transcriber"
version = "0.4.1"
description = "Local-first media library and transcription data core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Local Transcriber contributors" }]
dependencies = [
    "av>=15,<17",
    "ctranslate2==4.8.2",
    "faster-whisper==1.2.1",
]

[project.scripts]
local-transcriber = "local_transcriber.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.test-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
